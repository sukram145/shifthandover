<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taboche Pro Handover</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo-area">
                <div class="logo-circle">T</div>
                <h1>Taboche <span>Handover</span></h1>
            </div>
            <p id="currentDate"></p>
        </header>

        <main class="grid-layout">
            <!-- Staff & Shift Card -->
            <section class="card glass">
                <div class="card-header"><i class="fa-solid fa-user-tie"></i> Personnel</div>
                <div class="input-group">
                    <label>Staff Member</label>
                    <input type="text" id="staffName" placeholder="Enter name..." autocomplete="off">
                </div>
                <div class="input-group">
                    <label>Shift Type</label>
                    <select id="shift">
                        <option value="Morning">☀️ Morning</option>
                        <option value="Evening">🌙 Evening</option>
                        <option value="Full Day">📅 Full Day</option>
                    </select>
                </div>
            </section>

            <!-- Settings Card -->
            <section class="card glass">
                <div class="card-header"><i class="fa-solid fa-cash-register"></i> Register Settings</div>
                <div class="input-group">
                    <label>Opening Float (Base)</label>
                    <select id="startingFloat">
                        <option value="5000">₹5,000</option>
                        <option value="3000">₹3,000</option>
                        <option value="0">₹0</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Digital Payments (UPI/Card)</label>
                    <input type="number" id="digital" value="0" min="0">
                </div>
            </section>

            <!-- Cash Counter Card -->
            <section class="card glass span-two">
                <div class="card-header"><i class="fa-solid fa-money-bill-wave"></i> Cash Denominations</div>
                <div class="denomination-grid">
                    <div class="denom-row"><span>₹1000</span><input type="number" class="denom-input" data-val="1000" id="d1000" value="0"><span class="row-total" id="t1000">₹0</span></div>
                    <div class="denom-row"><span>₹500</span><input type="number" class="denom-input" data-val="500" id="d500" value="0"><span class="row-total" id="t500">₹0</span></div>
                    <div class="denom-row"><span>₹100</span><input type="number" class="denom-input" data-val="100" id="d100" value="0"><span class="row-total" id="t100">₹0</span></div>
                    <div class="denom-row"><span>₹50</span><input type="number" class="denom-input" data-val="50" id="d50" value="0"><span class="row-total" id="t50">₹0</span></div>
                    <div class="denom-row"><span>₹20</span><input type="number" class="denom-input" data-val="20" id="d20" value="0"><span class="row-total" id="t20">₹0</span></div>
                    <div class="denom-row"><span>₹10</span><input type="number" class="denom-input" data-val="10" id="d10" value="0"><span class="row-total" id="t10">₹0</span></div>
                     <div class="denom-row"><span>₹5</span><input type="number" class="denom-input" data-val="5" id="d5" value="0"><span class="row-total" id="t5">₹0</span></div>
                </div>
            </section>

            <!-- Remarks Card -->
            <section class="card glass">
                <div class="card-header"><i class="fa-solid fa-pen"></i> Remarks</div>
                <textarea id="notes" placeholder="Any discrepancies or notes..."></textarea>
            </section>

            <!-- Summary Card -->
            <section class="card summary-card">
                <div class="card-header">Handover Summary</div>
                <div class="summary-line"><span>Total Cash:</span> <span id="cashTotal">₹0</span></div>
                <div class="summary-line"><span>Digital Total:</span> <span id="digitalTotalDisplay">₹0</span></div>
                <div class="summary-line highlight"><span>Grand Total:</span> <span id="grandTotal">₹0</span></div>
                <div class="summary-line net"><span>Net Sale (Minus Float):</span> <span id="netHandover">₹0</span></div>
                
                <div class="button-group">
                    <button id="copyBtn" class="btn secondary"><i class="fa-solid fa-copy"></i> Copy Text</button>
                    <button id="whatsappBtn" class="btn primary"><i class="fa-brands fa-whatsapp"></i> WhatsApp</button>
                    <button id="resetBtn" class="btn danger"><i class="fa-solid fa-rotate-right"></i> Reset</button>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 Taboche Restaurant Management System</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
